name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bash:
    name: Bash lint & syntax
    runs-on: ubuntu-latest
    steps:
      # v5+ runs on Node 24 (avoids Node 20 deprecation on Actions)
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: bash -n
        run: bash -n deploy-codex.sh deploy.sh verify.sh

      - name: ShellCheck
        run: |
          set +e
          shellcheck -x -S warning deploy-codex.sh deploy.sh verify.sh
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::ShellCheck reported issues (exit $code)"
            shellcheck -x -S style deploy-codex.sh deploy.sh verify.sh || true
          fi

      - name: Portable model catalog validation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("assets/models-gpt56-non-lite.json")
          models = {m["slug"]: m for m in json.loads(path.read_text()).get("models", [])}
          assert {"gpt-5.6-sol", "gpt-5.5"} <= models.keys()
          for slug in ("gpt-5.6-sol",):
              assert models[slug]["use_responses_lite"] is False
              assert models[slug]["tool_mode"] == "code_mode_only"
              assert models[slug]["apply_patch_tool_type"] == "freeform"
          PY
          ! grep -RIE 'sk-[A-Za-z0-9_-]{16,}|Bearer[[:space:]]+[A-Za-z0-9._-]{16,}' \
            assets templates deploy.sh verify.sh

      - name: Live verification sandbox regression check
        run: |
          grep -Fq 'CODEX_LIVE_SANDBOX:-workspace-write' verify.sh
          grep -Fq -- '--sandbox "${live_sandbox}"' verify.sh
          ! grep -Fq -- '--sandbox read-only' verify.sh
          grep -Fq -- '--sandbox workspace-write' README.md

      - name: Portable deploy smoke
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/home/.codex"
          printf 'old-config\n' > "$tmp/home/.codex/config.toml"
          printf '{"OPENAI_API_KEY":"ci-placeholder"}\n' > "$tmp/home/.codex/auth.json"
          CODEX_TARGET_USER="$(id -un)" \
          CODEX_TARGET_HOME="$tmp/home" \
          CODEX_SKIP_INSTALL=1 \
            bash deploy.sh
          CODEX_TARGET_USER="$(id -un)" \
          CODEX_TARGET_HOME="$tmp/home" \
          CODEX_SKIP_VERSION_CHECK=1 \
            bash verify.sh
          test -f "$tmp/home/.codex/models-gpt56-non-lite.json"
          test -f "$tmp/home/.codex/config.toml"
          test -f "$tmp/home/.codex/auth.json"
          grep -Fq 'ci-placeholder' "$tmp/home/.codex/auth.json"
          test "$(find "$tmp/home/.codex" -maxdepth 1 -name 'config.toml.bak.*' | wc -l)" -eq 1
          grep -Fq "model_catalog_json = \"$tmp/home/.codex/models-gpt56-non-lite.json\"" \
            "$tmp/home/.codex/config.toml"
          ! grep -Rq '__MODEL_CATALOG_JSON__' "$tmp/home/.codex/config.toml"
          rm -rf "$tmp"

      - name: npm package includes code-mode host
        run: |
          tmp=$(mktemp -d)
          npm install -g --prefix "$tmp/npm" @openai/codex@0.147.0
          mkdir -p "$tmp/home"
          PATH="$tmp/npm/bin:$PATH" \
          CODEX_TARGET_USER="$(id -un)" \
          CODEX_TARGET_HOME="$tmp/home" \
            bash deploy.sh
          PATH="$tmp/npm/bin:$PATH" \
          CODEX_TARGET_USER="$(id -un)" \
          CODEX_TARGET_HOME="$tmp/home" \
            bash verify.sh
          find "$tmp/npm" -type f -name codex-code-mode-host -perm /111 -print -quit | grep -q .
          rm -rf "$tmp"

      - name: Homebrew Cask conflict remediation
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/bin" "$tmp/home"
          cat > "$tmp/bin/uname" <<'SH'
          #!/usr/bin/env bash
          printf 'Darwin\n'
          SH
          cat > "$tmp/bin/codex" <<'SH'
          #!/usr/bin/env bash
          if [[ -f "${MOCK_STATE}" ]]; then
            printf 'codex-cli 0.147.0\n'
          else
            printf 'codex-cli 0.146.0\n'
          fi
          SH
          cat > "$tmp/bin/brew" <<'SH'
          #!/usr/bin/env bash
          printf 'brew %s\n' "$*" >> "${MOCK_LOG}"
          case "$1 $2 $3" in
            'list --cask codex'|'uninstall --cask codex') exit 0 ;;
            *) exit 1 ;;
          esac
          SH
          cat > "$tmp/bin/npm" <<'SH'
          #!/usr/bin/env bash
          printf 'npm %s\n' "$*" >> "${MOCK_LOG}"
          touch "${MOCK_STATE}"
          printf '#!/usr/bin/env bash\nexit 0\n' > "${MOCK_BIN}/codex-code-mode-host"
          chmod +x "${MOCK_BIN}/codex-code-mode-host"
          SH
          chmod +x "$tmp/bin/uname" "$tmp/bin/codex" "$tmp/bin/brew" "$tmp/bin/npm"
          MOCK_STATE="$tmp/installed" \
          MOCK_LOG="$tmp/log" \
          MOCK_BIN="$tmp/bin" \
          PATH="$tmp/bin:$PATH" \
          CODEX_TARGET_USER="$(id -un)" \
          CODEX_TARGET_HOME="$tmp/home" \
            bash deploy.sh
          grep -Fq 'brew uninstall --cask codex' "$tmp/log"
          grep -Fq 'npm install -g @openai/codex@0.147.0' "$tmp/log"
          rm -rf "$tmp"

      - name: Help / version smoke
        run: |
          bash deploy-codex.sh --version
          bash deploy-codex.sh --help | head -12

      - name: Root required check (non-root should fail fast)
        run: |
          set +e
          out=$(bash deploy-codex.sh 2>&1)
          code=$?
          set -e
          echo "$out" | tail -5
          test "$code" -ne 0
          echo "$out" | grep -q 'root\|sudo\|Linux'

      - name: Missing params under root (should fail before install)
        run: |
          set +e
          out=$(sudo CODEX_API_KEY= CODEX_BASE_URL= bash deploy-codex.sh 2>&1)
          code=$?
          set -e
          echo "$out" | tail -15
          test "$code" -ne 0

      - name: Dry-run writes config only (no npm install of codex)
        run: |
          tmp=$(mktemp -d)
          codex_home="$tmp/codex"
          sudo CODEX_HOME="$codex_home" \
               CODEX_API_KEY='sk-ci-dryrun-key-abcdefgh' \
               CODEX_BASE_URL='https://example.com/v1' \
               CODEX_PROVIDER='custom' \
               CODEX_AUTH_STYLE='both' \
               bash deploy-codex.sh --dry-run
          test -f "$codex_home/config.toml"
          test -f "$codex_home/auth.json"
          grep -q 'model_provider = "custom"' "$codex_home/config.toml"
          grep -q 'experimental_bearer_token' "$codex_home/config.toml"
          # codex binary should not be required by dry-run
          echo "dry-run OK"
          # uninstall with confirm
          sudo CODEX_HOME="$codex_home" CODEX_UNINSTALL_CONFIRM=1 bash deploy-codex.sh --uninstall
          test ! -e "$codex_home"
          echo "uninstall OK"
          sudo rm -rf "$tmp"

      - name: Uninstall without confirm fails
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/codex"
          echo 'x' > "$tmp/codex/config.toml"
          set +e
          out=$(sudo CODEX_HOME="$tmp/codex" bash deploy-codex.sh --uninstall 2>&1)
          code=$?
          set -e
          echo "$out" | tail -8
          test "$code" -ne 0
          test -d "$tmp/codex"
          sudo rm -rf "$tmp"

  powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse script
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path deploy-codex.ps1).Path,
            [ref]$null,
            [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "PowerShell parse failed"
          }
          Write-Host "PowerShell parse OK"

      - name: Version / Help / flag smoke
        shell: pwsh
        run: |
          & .\deploy-codex.ps1 -Version
          & .\deploy-codex.ps1 -Help | Select-Object -First 16

      - name: DryRun + Uninstall smoke
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP ("deploy-codex-ci-" + [guid]::NewGuid().ToString())
          $codexHome = Join-Path $tmp 'codex'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $env:CODEX_HOME = $codexHome
          $env:CODEX_API_KEY = 'sk-ci-dryrun-key-abcdefgh'
          $env:CODEX_BASE_URL = 'https://example.com/v1'
          $env:CODEX_PROVIDER = 'custom'
          $env:CODEX_AUTH_STYLE = 'both'
          & .\deploy-codex.ps1 -DryRun -NonInteractive
          if (-not (Test-Path -LiteralPath (Join-Path $codexHome 'config.toml'))) {
            throw 'config.toml missing after DryRun'
          }
          $env:CODEX_UNINSTALL_CONFIRM = '1'
          & .\deploy-codex.ps1 -Uninstall -NonInteractive
          if (Test-Path -LiteralPath $codexHome) {
            throw 'codex home still exists after Uninstall'
          }
          Write-Host 'DryRun + Uninstall OK'
          Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue
